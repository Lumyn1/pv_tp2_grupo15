<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tu lenguaje favorito</title>
    <link rel="stylesheet" href="/assets/css/ejercicio24.css" />
  </head>
  <body>
    <div class="contenedor">
      <h2>selecciona tu lenguaje favorito</h2>
    </div>

    <div class="opciones">
      <input type="radio" id="python" name="lenguaje" value="python" />
      <label for="python">Python</label><br />
      <input type="radio" id="javascript" name="lenguaje" value="javascript" />
      <label for="javascript">JavaScript</label><br />
      <input type="radio" id="java" name="lenguaje" value="java" />
      <label for="java">Java</label><br />
      <input type="radio" id="csharp" name="lenguaje" value="csharp" />
      <label for="csharp">C#</label><br />
    </div>

    <div class="contenedor">
      <p id="mensaje">todavia no seleccionaste un lenguaje</p>
    </div>
    <script src="../js/ejercicio24.js"></script>
  </body>
</html>
