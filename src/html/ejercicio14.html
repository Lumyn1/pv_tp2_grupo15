<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
</head>
<body>
<script>
    let cantidad = (prompt("Ingrese valores"));
    let numeros = [];
    for (let i = 0; i < cantidad; i++) {
        let valor = (prompt("Ingrese un número"));
        numeros.push(valor);
    }
    const duplicar = (numeros) => {
        let resultado = [];
        for (let i = 0; i < numeros.length; i++) {
            resultado.push(numeros[i] * 2);
        }

        return resultado;
    }
    console.log("Su duplicado es:"+duplicar(numeros));
    alert(duplicar(numeros));
</script>
    <h1>HOLA</h1>
</body>
</html>
